<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1940" viewBox="0 0 2140 1940">
  <defs>
    <style>
      .bg{fill:#fbf7ee}
      .phone{fill:#fffdf8;stroke:#d8d2c6;stroke-width:2}
      .card{fill:#ffffff;stroke:#d8d2c6;stroke-width:2}
      .dash{fill:#fffdf8;stroke:#d7c76f;stroke-width:2;stroke-dasharray:8 8}
      .lav{fill:#c9b7ff}
      .lav2{fill:#eee7ff}
      .pink{fill:#ffd6df}
      .yellow{fill:#fff0a8}
      .mint{fill:#cfeee2}
      .gray{fill:#efeee9}
      .ink{fill:#1f2737}
      .muted{fill:#747887}
      .line{stroke:#d8d2c6;stroke-width:2}
      .flow{stroke:#9a8be8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .title{font:700 22px Arial, sans-serif;fill:#1f2737}
      .h1{font:700 20px Arial, sans-serif;fill:#1f2737}
      .body{font:400 14px Arial, sans-serif;fill:#747887}
      .small{font:400 12px Arial, sans-serif;fill:#747887}
      .btn{font:700 14px Arial, sans-serif;fill:#ffffff}
      .label{font:700 13px Arial, sans-serif;fill:#1f2737}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#9a8be8" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="2140" height="1940" class="bg"/>
  <text x="70" y="62" class="title">Sogon.zip Mobile Wireframe Board</text>
  <text x="70" y="88" class="body">README + SOGONZIP.md 기반. Figma import 후 각 390 x 844 프레임으로 재구성.</text>

  <!-- 01 Intro -->
  <g transform="translate(70 130)">
    <text x="0" y="-18" class="label">01 Intro</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <circle cx="92" cy="112" r="20" class="lav2"/>
    <circle cx="304" cy="152" r="26" class="yellow"/>
    <rect x="145" y="190" width="100" height="86" rx="22" class="lav"/>
    <rect x="162" y="177" width="58" height="24" rx="8" class="lav"/>
    <text x="114" y="354" class="title">소곤.zip</text>
    <text x="91" y="408" class="h1">조용히 저장한 취향이,</text>
    <text x="103" y="434" class="h1">우리의 시간이 되는 곳.</text>
    <text x="94" y="488" class="body">취향은 추천으로 풀리고,</text>
    <text x="100" y="512" class="body">마음은 정해둔 날에 열려요.</text>
    <rect x="28" y="766" width="334" height="54" rx="18" class="lav"/>
    <text x="169" y="799" class="btn">시작하기</text>
  </g>

  <!-- 02 Relationship -->
  <g transform="translate(510 130)">
    <text x="0" y="-18" class="label">02 Relationship Selection</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <text x="69" y="86" class="h1">누구와 소곤.zip을 시작할까요?</text>
    <rect x="28" y="198" width="334" height="188" rx="24" class="card"/>
    <rect x="165" y="230" width="60" height="60" rx="16" class="pink"/>
    <text x="132" y="323" class="h1">연인과 시작하기</text>
    <text x="84" y="352" class="body">데이트와 기념일을 더 편하게 기록해요.</text>
    <rect x="28" y="414" width="334" height="188" rx="24" class="card"/>
    <rect x="165" y="446" width="60" height="60" rx="16" class="mint"/>
    <text x="132" y="539" class="h1">친구와 시작하기</text>
    <text x="84" y="568" class="body">약속, 여행, 취향을 더 쉽게 맞춰요.</text>
  </g>

  <!-- 03 Create Room -->
  <g transform="translate(950 130)">
    <text x="0" y="-18" class="label">03 Create / Join Room</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <text x="130" y="86" class="h1">소곤방 만들기</text>
    <text x="28" y="160" class="label">닉네임을 입력해주세요</text>
    <rect x="28" y="178" width="334" height="54" rx="16" class="card"/>
    <text x="48" y="212" class="small">예: 지우</text>
    <rect x="28" y="650" width="334" height="54" rx="18" class="lav"/>
    <text x="137" y="683" class="btn">새 소곤방 만들기</text>
    <rect x="28" y="720" width="334" height="54" rx="18" class="card"/>
    <text x="140" y="753" class="label">초대코드로 들어가기</text>
  </g>

  <!-- 04 Invite -->
  <g transform="translate(1390 130)">
    <text x="0" y="-18" class="label">04 Invite Code</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <text x="101" y="86" class="h1">상대방을 초대해주세요</text>
    <text x="168" y="245" class="body">초대 코드</text>
    <rect x="83" y="270" width="224" height="90" rx="20" class="dash"/>
    <text x="132" y="326" class="title">A7K92</text>
    <rect x="28" y="460" width="334" height="54" rx="18" class="card"/>
    <text x="145" y="493" class="label">코드 복사하기</text>
    <rect x="28" y="528" width="334" height="54" rx="18" class="lav"/>
    <text x="166" y="561" class="btn">공유하기</text>
    <rect x="28" y="766" width="334" height="54" rx="18" class="gray"/>
    <text x="149" y="799" class="label">나중에 초대하기</text>
  </g>

  <!-- 05 Home -->
  <g transform="translate(70 1060)">
    <text x="0" y="-18" class="label">05 Home</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <text x="180" y="54" class="small">D+87</text>
    <text x="123" y="84" class="h1">지우의 소곤.zip</text>
    <rect x="28" y="124" width="334" height="132" rx="24" class="lav"/>
    <text x="54" y="164" class="btn">오늘의 추천.zip</text>
    <text x="54" y="194" class="small" fill="#ffffff">두 사람의 취향을 조심스럽게 풀어봤어요.</text>
    <rect x="54" y="212" width="282" height="36" rx="12" fill="#ffffff"/>
    <text x="164" y="235" class="label">추천 열기</text>
    <rect x="28" y="280" width="334" height="116" rx="24" class="card"/>
    <text x="54" y="320" class="label">다가오는 소곤파일</text>
    <text x="54" y="350" class="small">열릴 파일 2개가 있어요.</text>
    <rect x="28" y="420" width="334" height="116" rx="24" class="card"/>
    <text x="54" y="460" class="label">최근 기록.zip</text>
    <text x="54" y="490" class="small">열린 파일 1개가 기록됐어요.</text>
    <rect x="28" y="566" width="334" height="78" rx="24" class="dash"/>
    <text x="119" y="612" class="label">새 소곤파일 만들기 .zip</text>
    <rect x="0" y="760" width="390" height="84" fill="#ffffff"/>
    <text x="58" y="808" class="small">Home</text>
    <text x="168" y="808" class="small">Folder</text>
    <text x="288" y="808" class="small">Create</text>
  </g>

  <!-- 06 Create File -->
  <g transform="translate(510 1060)">
    <text x="0" y="-18" class="label">06 Create Sogon File</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <rect width="390" height="78" rx="34" class="card"/>
    <text x="116" y="49" class="h1">새 소곤파일 만들기</text>
    <text x="85" y="116" class="body">언젠가 알려주고 싶은 취향이나 마음을</text>
    <text x="122" y="140" class="body">조용히 저장해보세요.</text>
    <text x="28" y="190" class="label">파일 태그</text>
    <rect x="28" y="208" width="56" height="32" rx="16" class="lav"/>
    <rect x="92" y="208" width="72" height="32" rx="16" class="card"/>
    <rect x="172" y="208" width="56" height="32" rx="16" class="card"/>
    <rect x="236" y="208" width="92" height="32" rx="16" class="card"/>
    <text x="28" y="286" class="label">파일 내용</text>
    <rect x="28" y="304" width="334" height="118" rx="16" class="card"/>
    <text x="48" y="336" class="small">예: 사실 나는 매운 음식을 잘 못 먹어.</text>
    <text x="28" y="470" class="label">민감도</text>
    <circle cx="83" cy="516" r="17" class="gray"/>
    <circle cx="139" cy="516" r="17" class="gray"/>
    <circle cx="195" cy="516" r="22" class="lav2"/>
    <circle cx="251" cy="516" r="17" class="gray"/>
    <circle cx="307" cy="516" r="17" class="gray"/>
    <text x="28" y="578" class="label">열리는 시점</text>
    <rect x="28" y="596" width="334" height="50" rx="16" class="card"/>
    <text x="48" y="627" class="small">내가 직접 열게요</text>
    <rect x="28" y="670" width="334" height="70" rx="16" class="card"/>
    <text x="48" y="700" class="label">추천에 반영하기</text>
    <text x="48" y="724" class="small">열리기 전에도 추천에는 조심스럽게 반영</text>
    <rect x="302" y="694" width="42" height="24" rx="12" class="lav"/>
    <circle cx="330" cy="706" r="10" fill="#ffffff"/>
    <rect x="0" y="760" width="390" height="84" fill="#ffffff"/>
    <rect x="28" y="776" width="334" height="52" rx="18" class="lav"/>
    <text x="137" y="808" class="btn">소곤파일 저장하기</text>
  </g>

  <!-- 07 Folder -->
  <g transform="translate(950 1060)">
    <text x="0" y="-18" class="label">07 My Sogon Folder</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <rect width="390" height="126" rx="34" class="card"/>
    <text x="145" y="49" class="h1">내 소곤폴더</text>
    <text x="28" y="98" class="label">열릴 예정</text>
    <text x="112" y="98" class="small">열 준비됨</text>
    <text x="206" y="98" class="small">열림</text>
    <text x="266" y="98" class="small">닫아둠</text>
    <line x1="28" y1="112" x2="92" y2="112" stroke="#c9b7ff" stroke-width="3"/>
    <rect x="28" y="160" width="334" height="152" rx="22" class="card"/>
    <text x="54" y="200" class="label">음식취향.zip</text>
    <rect x="258" y="180" width="78" height="28" rx="14" class="gray"/>
    <text x="276" y="199" class="small">locked</text>
    <text x="54" y="232" class="small">D+100 열림 예정</text>
    <text x="54" y="260" class="small">추천 반영 ON | 민감도 2</text>
    <rect x="54" y="276" width="130" height="28" rx="10" class="gray"/>
    <rect x="194" y="276" width="130" height="28" rx="10" class="gray"/>
    <rect x="28" y="336" width="334" height="152" rx="22" class="card"/>
    <text x="54" y="376" class="label">데이트 취향.zip</text>
    <rect x="258" y="356" width="78" height="28" rx="14" class="lav2"/>
    <text x="284" y="375" class="small">ready</text>
    <text x="54" y="408" class="small">오늘 열 수 있어요</text>
    <rect x="54" y="432" width="282" height="40" rx="14" class="lav"/>
    <text x="154" y="457" class="btn">열기 확인하기</text>
    <rect x="0" y="760" width="390" height="84" fill="#ffffff"/>
  </g>

  <!-- 08 Unzip -->
  <g transform="translate(1390 1060)">
    <text x="0" y="-18" class="label">08 Unzip Confirmation</text>
    <rect width="390" height="844" rx="34" class="phone"/>
    <rect width="390" height="78" rx="34" class="card"/>
    <text x="139" y="49" class="h1">소곤파일 열기</text>
    <text x="85" y="124" class="h1">오늘 열 수 있는 소곤파일이에요</text>
    <text x="92" y="154" class="body">상대에게 보여주기 전에 마지막 확인</text>
    <rect x="28" y="202" width="334" height="190" rx="24" class="lav2"/>
    <text x="54" y="244" class="label">음식취향.zip</text>
    <rect x="54" y="268" width="282" height="70" rx="14" class="card"/>
    <text x="72" y="306" class="body">"사실 나는 매운 음식을 잘 못 먹어."</text>
    <text x="54" y="366" class="small">열기 전까지 상대는 볼 수 없어요</text>
    <text x="28" y="444" class="label">함께 보낼 메시지</text>
    <rect x="28" y="462" width="334" height="96" rx="16" class="card"/>
    <rect x="0" y="628" width="390" height="216" fill="#ffffff"/>
    <rect x="28" y="646" width="334" height="50" rx="18" class="lav"/>
    <text x="169" y="677" class="btn">오늘 열기</text>
    <rect x="28" y="710" width="334" height="50" rx="18" class="card"/>
    <text x="151" y="741" class="label">수정하고 열기</text>
    <text x="64" y="796" class="small">다음 기념일로 미루기</text>
    <text x="234" y="796" class="small">아직 닫아두기</text>
  </g>

  <!-- Flow arrows -->
  <path d="M460 550 C480 550 490 550 510 550" class="flow"/>
  <path d="M900 550 C920 550 930 550 950 550" class="flow"/>
  <path d="M1340 550 C1360 550 1370 550 1390 550" class="flow"/>
  <path d="M1585 974 C1585 1018 1585 1018 1585 1060" class="flow"/>
  <path d="M1390 1482 C1160 1482 1140 1482 1284 1482" class="flow"/>
  <path d="M950 1482 C920 1482 920 1482 900 1482" class="flow"/>
  <path d="M510 1482 C480 1482 480 1482 460 1482" class="flow"/>

  <!-- Received + Record mini frames -->
  <g transform="translate(1830 130)">
    <text x="0" y="-18" class="label">09 Received File</text>
    <rect width="260" height="562" rx="28" class="phone"/>
    <text x="82" y="50" class="h1">받은 소곤파일</text>
    <text x="44" y="98" class="label">새로운 소곤파일이 열렸어요</text>
    <rect x="32" y="124" width="196" height="38" rx="19" class="pink"/>
    <rect x="24" y="194" width="212" height="130" rx="22" class="yellow"/>
    <text x="48" y="232" class="label">음식취향.zip</text>
    <rect x="48" y="252" width="164" height="48" rx="12" class="card"/>
    <text x="34" y="368" class="label">반응 남기기</text>
    <rect x="24" y="390" width="62" height="70" rx="14" class="card"/>
    <rect x="99" y="390" width="62" height="70" rx="14" class="card"/>
    <rect x="174" y="390" width="62" height="70" rx="14" class="card"/>
    <rect x="24" y="500" width="212" height="42" rx="15" class="lav"/>
  </g>

  <g transform="translate(1830 800)">
    <text x="0" y="-18" class="label">10 Record Calendar</text>
    <rect width="260" height="562" rx="28" class="phone"/>
    <text x="96" y="50" class="h1">기록.zip</text>
    <rect x="24" y="88" width="212" height="118" rx="20" class="card"/>
    <line x1="48" y1="130" x2="212" y2="130" class="line"/>
    <line x1="48" y1="166" x2="212" y2="166" class="line"/>
    <line x1="84" y1="104" x2="84" y2="190" class="line"/>
    <line x1="130" y1="104" x2="130" y2="190" class="line"/>
    <line x1="176" y1="104" x2="176" y2="190" class="line"/>
    <rect x="24" y="240" width="212" height="88" rx="18" class="card"/>
    <text x="44" y="276" class="label">카페취향.zip 열림</text>
    <text x="44" y="302" class="small">반응 1개</text>
    <rect x="24" y="350" width="212" height="88" rx="18" class="card"/>
    <text x="44" y="386" class="label">음식취향.zip 열림</text>
    <text x="44" y="412" class="small">말해줘서 고마워</text>
  </g>
</svg>
