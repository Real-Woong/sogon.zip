<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 80" role="img" aria-labelledby="sogon-logo-title sogon-logo-desc">
  <title id="sogon-logo-title">Sogon.zip</title>
  <desc id="sogon-logo-desc">S자 취향 지퍼 심볼과 직접 그린 둥근 소문자, 압축 라벨로 구성한 Sogon.zip 로고</desc>
  <defs>
    <linearGradient id="sogon-logo-track" x1="8" y1="7" x2="64" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F58DAE"/>
      <stop offset=".5" stop-color="#CD79B7"/>
      <stop offset="1" stop-color="#8D76D8"/>
    </linearGradient>
    <linearGradient id="sogon-logo-pin" x1="48" y1="48" x2="65" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AB96EB"/>
      <stop offset="1" stop-color="#8068D2"/>
    </linearGradient>
    <linearGradient id="sogon-logo-zip" x1="258" y1="28" x2="318" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3A1BC"/>
      <stop offset="1" stop-color="#AB96E8"/>
    </linearGradient>
    <linearGradient id="sogon-logo-word" x1="78" y1="24" x2="234" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9628D"/>
      <stop offset=".52" stop-color="#A15FA1"/>
      <stop offset="1" stop-color="#7460B1"/>
    </linearGradient>
  </defs>

  <!-- 심볼이 워드마크의 대문자 S 역할을 한다. -->
  <g transform="translate(2 5) scale(1.08)">
    <g transform="translate(64 0) scale(-1 1)">
      <circle cx="7.5" cy="9.5" r="4.5" fill="#F6A0BA"/>
      <circle cx="18.5" cy="5.5" r="3.5" fill="#AE99E8"/>
      <path d="M8 10 14.5 15M18.5 6 14.5 15" fill="none" stroke="url(#sogon-logo-track)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M14.5 15C22 6.5 46 7 50.5 16.5 55 26 44 30.5 32 32.5 20 34.5 9 38.5 12.5 48.5 16 58.5 39.5 59.5 50.5 50" fill="none" stroke="url(#sogon-logo-track)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.5 15C22 6.5 46 7 50.5 16.5 55 26 44 30.5 32 32.5 20 34.5 9 38.5 12.5 48.5 16 58.5 39.5 59.5 50.5 50" fill="none" stroke="#FFF9FB" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 4.2"/>
      <g transform="translate(32 32.5) rotate(-10)">
        <rect x="-4.8" y="-4" width="9.6" height="8" rx="2.5" fill="#FFF9FB"/>
        <path d="M0 3.5v5" stroke="#FFF9FB" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="0" cy="-.2" r="1.25" fill="#B86BAC"/>
      </g>
      <path fill="url(#sogon-logo-pin)" d="M50.5 42.5a8.5 8.5 0 0 1 8.5 8.4c0 6-8.5 11-8.5 11S42 56.9 42 50.9a8.5 8.5 0 0 1 8.5-8.4Z"/>
      <path fill="#FFF9FB" d="M50.5 55.3c-.3 0-.8-.4-2.1-1.5-1.5-1.3-2.4-2.2-2.4-3.6a2.2 2.2 0 0 1 2.2-2.3c.9 0 1.7.5 2.3 1.3.6-.8 1.4-1.3 2.3-1.3a2.2 2.2 0 0 1 2.2 2.3c0 1.4-.9 2.3-2.4 3.6-1.3 1.1-1.8 1.5-2.1 1.5Z"/>
    </g>
  </g>

  <!-- 기성 폰트 대신 심볼의 둥근 획을 이어 직접 그린 ogon. -->
  <g fill="none" stroke="url(#sogon-logo-word)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M94 25c-10.2 0-16.5 6.8-16 17.6C78.5 53.4 84.9 60 94.8 60c10-.2 16.2-7.3 15.7-18.1C110 31.5 103.6 25 94 25Z"/>
    <path d="M128 25c-9.9 0-16 6.9-15.5 17.6.5 10.2 6.6 16.4 16 16.4 9.6-.1 15.5-7 15-17.2C143 31.6 137.1 25 128 25Zm15.5 2v30c0 12.7-6.8 19-17.5 19-6.2 0-10.7-2-13.7-5.3"/>
    <path d="M172 25c-9.8 0-16 6.9-15.6 17.4.4 10.7 6.8 17.6 16.6 17.6 9.9 0 16-7.2 15.6-17.8C188.2 31.8 182 25 172 25Z"/>
    <path d="M199.5 58V27.5m0 14c2.2-10.4 8-16.5 16.3-16.5 9.2 0 14.7 7 14.7 17.7V58"/>
  </g>
  <!-- 각 글자에 취향·압축·추천을 암시하는 서로 다른 포인트를 준다. -->
  <path fill="#F18EAE" d="M94.4 45.5c-.3 0-.8-.3-1.9-1.3-1.3-1.1-2.1-1.9-2.1-3.1 0-1.2.9-2 2-2 .8 0 1.5.4 2 1.1.5-.7 1.2-1.1 2-1.1 1.1 0 2 .8 2 2 0 1.2-.8 2-2.1 3.1-1.1 1-1.6 1.3-1.9 1.3Z"/>
  <g fill="#FFF5FA">
    <circle cx="142.3" cy="61.8" r="1.25"/>
    <circle cx="140.2" cy="67.2" r="1.25"/>
    <circle cx="136.2" cy="71.5" r="1.25"/>
    <circle cx="130.8" cy="74.1" r="1.25"/>
  </g>
  <path fill="#A58BE4" d="m172.4 37.2 1.3 3.3 3.4 1.4-3.4 1.4-1.3 3.3-1.3-3.3-3.4-1.4 3.4-1.4 1.3-3.3Z"/>
  <g fill="#FFF5FA">
    <circle cx="230" cy="43" r="1.45"/>
    <circle cx="230" cy="49" r="1.45"/>
    <circle cx="230" cy="55" r="1.45"/>
  </g>

  <!-- .zip은 파일 확장자처럼 독립된 작은 압축 라벨로 마감한다. -->
  <rect x="247" y="26" width="73" height="34" rx="17" fill="url(#sogon-logo-zip)"/>
  <g fill="none" stroke="#FFF9FB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="258" cy="50" r="2" fill="#FFF9FB" stroke="none"/>
    <path d="M266 38h12l-12 11h12m8-11v11m0-18v1m9 26V38h7c6 0 9 3 9 7s-3 7-9 7h-7"/>
  </g>
</svg>
