<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>소곤.zip — 둘만의 기록 보관함</title>
    <meta
      name="description"
      content="지금은 말 못 할 마음을 소곤파일에 담아두고, 정해둔 날에 둘이 함께 열어보는 관계 기록 앱."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fff7f7" />

    <!-- 아이콘 -->
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      링크 미리보기(카카오톡/슬랙 등).
      실제 도메인이 정해지면 아래 og:url / og:image 를 절대 URL로 바꿔야
      모든 크롤러에서 안전하게 썸네일이 뜬다. (예: https://sogonzip.pages.dev/og-image.png)
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="소곤.zip" />
    <meta property="og:title" content="소곤.zip — 둘만의 기록 보관함" />
    <meta
      property="og:description"
      content="지금은 말 못 할 마음을 담아두고, 정해둔 날에 함께 열어봐요."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="소곤.zip — 둘만의 기록 보관함" />
    <meta
      name="twitter:description"
      content="지금은 말 못 할 마음을 담아두고, 정해둔 날에 함께 열어봐요."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- 홈 화면에 추가했을 때 브라우저 크롬 없이 뜨도록 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="소곤.zip" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff7f7;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/FE/ProtoWeb/src/main.tsx"></script>
  </body>
</html>
